    <script>
      (function () {
        var origStringify = JSON.stringify;
        JSON.stringify = function (value, replacer, space) {
          try {
            return origStringify.call(JSON, value, replacer, space);
          } catch (err) {
            if (err && err instanceof TypeError) {
              var seen = new WeakSet();
              return origStringify.call(
                JSON,
                value,
                function (key, val) {
                  if (typeof val === 'object' && val !== null) {
                    if (seen.has(val)) return '[Circular]';
                    seen.add(val);
                  }
                  return typeof replacer === 'function' ? replacer.call(this, key, val) : val;
                },
                space
              );
            }
            throw err;
          }
        };
        window.addEventListener('error', function (event) {
          var msg = String((event && (event.message || (event.error && event.error.message))) || '');
          if (msg.indexOf('INTERNAL ASSERTION FAILED') !== -1 || msg.indexOf('Unexpected state') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = String((reason && (reason.message || reason)) || '');
          if (msg.indexOf('INTERNAL ASSERTION FAILED') !== -1 || msg.indexOf('Unexpected state') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
